bundle:
  name: day3-weather-mcp

variables:
  postgres_branch:
    description: Full Lakebase Postgres branch resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name.

resources:
  apps:
    app:
      name: day3-weather-mcp
      description: Streamable HTTP FastMCP weather tools with Lakebase tool activity.
      source_code_path: ./
      resources:
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  default:
    default: true
