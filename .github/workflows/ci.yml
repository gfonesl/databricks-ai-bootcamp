name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  python-tests:
    name: Python tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tripwise capstone
            path: capstone/tripwise-capstone
          - name: Day 2 weather intelligence
            path: homeworks/day-2-weather-intelligence
          - name: Day 3 MCP server
            path: homeworks/day-3-weather-mcp-agent/mcp_server
          - name: Day 3 dashboard
            path: homeworks/day-3-weather-mcp-agent/dashboard
    runs-on: ubuntu-latest
    env:
      TRIPWISE_AUTH_MODE: disabled
      TRIPWISE_SKIP_SCHEMA_INIT: "1"
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ${{ matrix.path }}/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r ${{ github.workspace }}/requirements-dev.txt
      - run: python -m pytest tests -q

  python-audit:
    name: Python audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Development tools
            file: requirements-dev.txt
          - name: Tripwise capstone
            file: capstone/tripwise-capstone/requirements.txt
          - name: Day 2 weather intelligence
            file: homeworks/day-2-weather-intelligence/requirements.txt
          - name: Day 3 MCP server
            file: homeworks/day-3-weather-mcp-agent/mcp_server/requirements.txt
          - name: Day 3 dashboard
            file: homeworks/day-3-weather-mcp-agent/dashboard/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install audit tool
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Audit fully pinned lockfile
        run: python -m pip_audit --disable-pip --no-deps -r "${{ matrix.file }}"

  day-1-node:
    name: Day 1 Node application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homeworks/day-1-lakebase-support-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: homeworks/day-1-lakebase-support-app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run build
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - run: npm test
